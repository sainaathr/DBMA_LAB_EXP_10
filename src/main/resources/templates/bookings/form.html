<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <title th:text="${pageTitle} + ' — MedScan'">New Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'bookings',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a th:href="@{/bookings}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
    <h2 class="h5 fw-700 mb-0">New Booking</h2>
  </div>

  <div class="card" style="max-width:820px;">
    <div class="card-header"><i class="bi bi-calendar-plus-fill text-teal"></i><span class="card-title">Book Appointment</span></div>
    <div class="card-body">
      <form th:action="@{/bookings/new}" th:object="${booking}" method="post" novalidate>

        <!-- Patient & Doctor -->
        <div class="form-section-title">Patient & Physician</div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label" for="patientId">Patient *</label>
            <select id="patientId" th:field="*{patientId}" class="form-select"
                    th:classappend="${#fields.hasErrors('patientId')} ? 'is-invalid'">
              <option value="">— Select Patient —</option>
              <option th:each="p : ${patients}" th:value="${p.patientId}" th:text="${p.patientName + ' (#' + p.patientId + ')'}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{patientId}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="doctorId">Referring Doctor</label>
            <select id="doctorId" th:field="*{doctorId}" class="form-select">
              <option value="">— None —</option>
              <option th:each="d : ${doctors}" th:value="${d.doctorId}" th:text="${d.doctorName + ' (' + d.specialization + ')'}"></option>
            </select>
          </div>
        </div>

        <!-- Center & Date -->
        <div class="form-section-title">Center & Schedule</div>
        <div class="row g-3 mb-3">
          <div class="col-md-5">
            <label class="form-label" for="centerId">Diagnostic Center *</label>
            <select id="centerId" th:field="*{centerId}" class="form-select"
                    th:classappend="${#fields.hasErrors('centerId')} ? 'is-invalid'">
              <option value="">— Select Center —</option>
              <option th:each="c : ${centers}" th:value="${c.centerId}" th:text="${c.centerName}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{centerId}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="bookingDate">Booking Date *</label>
            <input type="date" id="bookingDate" th:field="*{bookingDate}" class="form-control"
                   th:classappend="${#fields.hasErrors('bookingDate')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{bookingDate}"></div>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="bookingTime">Time</label>
            <input type="time" id="bookingTime" th:field="*{bookingTime}" class="form-control"/>
          </div>
        </div>

        <!-- Tests selection -->
        <div class="form-section-title">Select Diagnostic Tests *</div>
        <div th:if="${#fields.hasErrors('testIds')}" class="alert-error-custom mb-2 py-2 px-3" style="font-size:.82rem;">
          <i class="bi bi-exclamation-triangle me-1"></i>
          <span th:errors="*{testIds}"></span>
        </div>
        <div class="row g-2 mb-3" style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:12px;">
          <div class="col-md-6" th:each="t : ${tests}">
            <label class="d-flex align-items-center gap-2 p-2 rounded"
                   style="cursor:pointer;border:1px solid var(--border);font-size:.85rem;"
                   id="test-label" th:attr="data-price=${t.price}">
              <input type="checkbox" name="testIds" th:value="${t.testId}" class="test-chk"
                     style="accent-color:var(--teal);"/>
              <span>
                <strong th:text="${t.testName}"></strong>
                <span class="text-teal ms-1" th:text="'₹' + ${t.price}"></span>
              </span>
            </label>
          </div>
        </div>

        <!-- Running total (JS calculated) -->
        <div class="d-flex align-items-center justify-content-between mb-3 p-3 rounded"
             style="background:var(--surface); border:1px solid var(--border);">
          <span class="fw-600" style="font-size:.9rem;">Estimated Total</span>
          <span class="fw-700 text-teal" style="font-size:1.1rem;" id="estimatedTotal">₹0.00</span>
        </div>

        <!-- Status & Notes -->
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Status</label>
            <select th:field="*{status}" class="form-select">
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
            </select>
          </div>
          <div class="col-md-8">
            <label class="form-label">Notes</label>
            <input type="text" th:field="*{notes}" class="form-control" placeholder="Optional clinical notes…"/>
          </div>
        </div>

        <div class="d-flex gap-2 pt-2">
          <button type="submit" class="btn btn-teal"><i class="bi bi-calendar-check me-1"></i>Create Booking</button>
          <a th:href="@{/bookings}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Update estimated total as user selects tests (display only — server recalculates on submit)
document.querySelectorAll('.test-chk').forEach(cb => {
  cb.addEventListener('change', updateTotal);
});
function updateTotal() {
  let total = 0;
  document.querySelectorAll('.test-chk:checked').forEach(cb => {
    const label = cb.closest('label');
    const price = parseFloat(label.dataset.price || '0');
    total += price;
  });
  document.getElementById('estimatedTotal').textContent = '₹' + total.toFixed(2);
}
// Highlight selected test rows
document.querySelectorAll('.test-chk').forEach(cb => {
  cb.addEventListener('change', function() {
    const label = this.closest('label');
    label.style.background = this.checked ? 'rgba(13,148,136,.06)' : '';
    label.style.borderColor = this.checked ? 'var(--teal)' : 'var(--border)';
  });
});
</script>
</body></html>
