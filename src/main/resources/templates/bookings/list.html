<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Bookings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'bookings',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="h5 fw-700 mb-0">Bookings
      <span class="badge bg-light text-muted ms-2" style="font-size:.78rem;" th:text="${total}">0</span>
    </h2>
    <a th:href="@{/bookings/new}" class="btn btn-teal btn-sm"><i class="bi bi-plus-lg me-1"></i>New Booking</a>
  </div>
  <div class="card mb-3">
    <div class="card-body py-2">
      <form method="get" class="d-flex flex-wrap gap-2">
        <div class="search-box flex-grow-1">
          <i class="bi bi-search search-icon"></i>
          <input type="text" name="search" class="form-control" placeholder="Search by patient or ID…" th:value="${search}"/>
        </div>
        <select name="status" class="form-select" style="max-width:160px;">
          <option value="">All Statuses</option>
          <option th:each="s : ${ {'Pending','Confirmed','Completed','Cancelled'} }"
                  th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option>
        </select>
        <button class="btn btn-teal btn-sm px-3" type="submit">Filter</button>
        <a th:href="@{/bookings}" class="btn btn-ghost btn-sm">Clear</a>
      </form>
    </div>
  </div>
  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead><tr><th>#</th><th>Patient</th><th>Doctor</th><th>Center</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          <tr th:each="b : ${bookings}">
            <td class="fw-600 text-muted" th:text="${b.bookingId}"></td>
            <td class="fw-600" th:text="${b.patientName}"></td>
            <td class="text-muted-sm" th:text="${b.doctorName ?: '—'}"></td>
            <td th:text="${b.centerName}"></td>
            <td th:text="${b.bookingDate}"></td>
            <td><span th:class="'badge-pill badge-' + ${b.status.toLowerCase()}" th:text="${b.status}"></span></td>
            <td>
              <div class="d-flex gap-1">
                <a th:href="@{/bookings/{id}(id=${b.bookingId})}" class="btn-icon" title="View"><i class="bi bi-eye-fill"></i></a>
                <button class="btn-icon danger" onclick="confirmDelete(this)"
                  th:data-action="@{/bookings/{id}/delete(id=${b.bookingId})}"
                  th:data-name="'#' + ${b.bookingId}"><i class="bi bi-trash3-fill"></i></button>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(bookings)}">
            <td colspan="7"><div class="empty-state"><i class="bi bi-calendar-x"></i><p>No bookings found.</p></div></td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Pagination -->
    <div class="px-4 py-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span class="text-muted-sm">Page <strong th:text="${currentPage}">1</strong> of <strong th:text="${totalPages}">1</strong></span>
      <div class="pagination-wrap">
        <a th:href="@{/bookings(page=${currentPage-1},search=${search},status=${selectedStatus})}"
           class="page-btn" th:classappend="${currentPage==1} ? 'disabled'"><i class="bi bi-chevron-left"></i></a>
        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
          <a th:href="@{/bookings(page=${i},search=${search},status=${selectedStatus})}"
             class="page-btn" th:classappend="${i==currentPage} ? 'active'" th:text="${i}">1</a>
        </th:block>
        <a th:href="@{/bookings(page=${currentPage+1},search=${search},status=${selectedStatus})}"
           class="page-btn" th:classappend="${currentPage==totalPages} ? 'disabled'"><i class="bi bi-chevron-right"></i></a>
      </div>
    </div>
  </div>
  <form id="deleteForm" method="post" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  </form>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>function confirmDelete(btn){if(confirm('Delete booking '+btn.dataset.name+'?')){const f=document.getElementById('deleteForm');f.action=btn.dataset.action;f.submit();}}</script>
</body></html>
