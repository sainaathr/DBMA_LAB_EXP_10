<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Booking Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'bookings',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a th:href="@{/bookings}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
    <h2 class="h5 fw-700 mb-0" th:text="'Booking #' + ${booking.bookingId}">Booking Detail</h2>
    <span th:class="'badge-pill badge-' + ${booking.status.toLowerCase()} + ' ms-2'" th:text="${booking.status}"></span>
  </div>

  <div class="row g-3">
    <!-- Booking Info -->
    <div class="col-lg-7">
      <div class="card mb-3">
        <div class="card-header"><i class="bi bi-info-circle-fill text-teal"></i><span class="card-title">Booking Info</span></div>
        <div class="card-body">
          <dl class="row mb-0" style="font-size:.875rem;">
            <dt class="col-sm-5 text-muted">Patient</dt>
            <dd class="col-sm-7 fw-600" th:text="${booking.patientName}"></dd>
            <dt class="col-sm-5 text-muted">Doctor</dt>
            <dd class="col-sm-7" th:text="${booking.doctorName ?: '—'}"></dd>
            <dt class="col-sm-5 text-muted">Center</dt>
            <dd class="col-sm-7" th:text="${booking.centerName}"></dd>
            <dt class="col-sm-5 text-muted">Date</dt>
            <dd class="col-sm-7" th:text="${booking.bookingDate}"></dd>
            <dt class="col-sm-5 text-muted">Time</dt>
            <dd class="col-sm-7" th:text="${booking.bookingTime ?: '—'}"></dd>
            <dt class="col-sm-5 text-muted">Notes</dt>
            <dd class="col-sm-7" th:text="${booking.notes ?: '—'}"></dd>
            <dt class="col-sm-5 text-muted">Created</dt>
            <dd class="col-sm-7" th:text="${booking.createdAt}"></dd>
          </dl>
        </div>
      </div>

      <!-- Tests -->
      <div class="card mb-3">
        <div class="card-header"><i class="bi bi-clipboard2-pulse text-teal"></i><span class="card-title">Tests Booked</span></div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Test Name</th><th>Duration</th><th>Price (₹)</th></tr></thead>
            <tbody>
              <tr th:each="bt : ${booking.tests}">
                <td th:text="${bt.testName}"></td>
                <td th:text="${bt.durationMinutes} + ' min'"></td>
                <td class="fw-600 text-teal" th:text="'₹' + ${bt.agreedPrice}"></td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td colspan="2" class="text-end fw-700">Total</td>
                <td class="fw-700 text-teal" th:text="'₹' + ${#aggregates.sum(booking.tests.![agreedPrice])}"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="col-lg-5">
      <!-- Status Update -->
      <div class="card mb-3">
        <div class="card-header"><i class="bi bi-arrow-repeat text-teal"></i><span class="card-title">Update Status</span></div>
        <div class="card-body">
          <form th:action="@{/bookings/{id}/status(id=${booking.bookingId})}" method="post" class="d-flex gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <select name="status" class="form-select">
              <option th:each="s : ${ {'Pending','Confirmed','Completed','Cancelled'} }"
                      th:value="${s}" th:text="${s}"
                      th:selected="${s == booking.status}"></option>
            </select>
            <button type="submit" class="btn btn-teal btn-sm px-3">Update</button>
          </form>
        </div>
      </div>

      <!-- Billing -->
      <div class="card mb-3">
        <div class="card-header"><i class="bi bi-receipt text-teal"></i><span class="card-title">Billing</span></div>
        <div class="card-body">
          <div th:if="${existingBill != null}">
            <div class="mb-2 d-flex justify-content-between" style="font-size:.875rem;">
              <span class="text-muted">Status</span>
              <span th:class="'badge-pill badge-' + ${existingBill.paymentStatus.toLowerCase()}"
                    th:text="${existingBill.paymentStatus}"></span>
            </div>
            <a th:href="@{/billing/{id}(id=${existingBill.billId})}" class="btn btn-teal btn-sm w-100">
              <i class="bi bi-eye me-1"></i>View Bill #<span th:text="${existingBill.billId}"></span>
            </a>
          </div>
          <div th:if="${existingBill == null}">
            <p class="text-muted-sm mb-2">No bill generated yet. Generate one to record payment.</p>
            <form th:action="@{/billing/generate}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="bookingId" th:value="${booking.bookingId}"/>
              <div class="mb-2">
                <label class="form-label" style="font-size:.8rem;">Discount (₹)</label>
                <input type="number" name="discountAmount" value="0" min="0" step="0.01" class="form-control form-control-sm"/>
              </div>
              <button type="submit" class="btn btn-teal btn-sm w-100"
                      th:disabled="${#lists.isEmpty(booking.tests)}">
                <i class="bi bi-receipt me-1"></i>Generate Bill
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
