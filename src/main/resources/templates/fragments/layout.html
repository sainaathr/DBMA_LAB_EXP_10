<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Main layout fragment — used by all authenticated pages.
  Include with: th:replace="~{fragments/layout :: page(~{::title}, ~{::body-content})}"
-->
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} + ' — MedScan DCMS'">MedScan DCMS</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- Custom design system -->
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<div th:fragment="layout(pageTitle, activePage, content)">
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="_csrf"        th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} + ' — MedScan DCMS'">MedScan DCMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- ══ Sidebar ════════════════════════════════════════════════ -->
<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></div>
    <div>
      <div class="brand-name">MedScan DCMS</div>
      <div class="brand-sub">Diagnostic Center</div>
    </div>
  </div>

  <nav>
    <div class="nav-section-label">Main</div>
    <a th:href="@{/dashboard}" class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
      <i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>

    <div class="nav-section-label">Management</div>
    <a th:href="@{/patients}" class="sidebar-link" th:classappend="${activePage == 'patients'} ? 'active'">
      <i class="bi bi-people-fill"></i><span>Patients</span></a>
    <a th:href="@{/doctors}" class="sidebar-link" th:classappend="${activePage == 'doctors'} ? 'active'">
      <i class="bi bi-person-badge-fill"></i><span>Doctors</span></a>
    <a th:href="@{/centers}" class="sidebar-link" th:classappend="${activePage == 'centers'} ? 'active'">
      <i class="bi bi-building-fill-cross"></i><span>Centers</span></a>
    <a th:href="@{/tests}" class="sidebar-link" th:classappend="${activePage == 'tests'} ? 'active'">
      <i class="bi bi-clipboard2-pulse-fill"></i><span>Medical Tests</span></a>

    <div class="nav-section-label">Operations</div>
    <a th:href="@{/bookings}" class="sidebar-link" th:classappend="${activePage == 'bookings'} ? 'active'">
      <i class="bi bi-calendar-check-fill"></i><span>Bookings</span></a>
    <a th:href="@{/billing}" class="sidebar-link" th:classappend="${activePage == 'billing'} ? 'active'">
      <i class="bi bi-receipt"></i><span>Billing</span></a>
    <a th:href="@{/reports}" class="sidebar-link" th:classappend="${activePage == 'reports'} ? 'active'">
      <i class="bi bi-bar-chart-fill"></i><span>Reports</span></a>
  </nav>

  <div class="sidebar-footer">
    <div class="footer-text">
      <i class="bi bi-shield-check text-teal me-1"></i>
      <span sec:authentication="name">User</span>
    </div>
  </div>
</aside>

<!-- ══ Topbar ═════════════════════════════════════════════════ -->
<header class="topbar">
  <div class="page-title" th:text="${pageTitle}">Page</div>
  <div class="top-actions">
    <div class="dropdown">
      <div class="user-menu" data-bs-toggle="dropdown">
        <div class="user-avatar" sec:authentication="name">A</div>
        <span class="d-none d-md-inline" sec:authentication="name">Admin</span>
        <i class="bi bi-chevron-down" style="font-size:.7rem;"></i>
      </div>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" style="font-size:.875rem;">
        <li><hr class="dropdown-divider"></li>
        <li>
          <form th:action="@{/logout}" method="post" class="px-3 py-1">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-sm btn-outline-danger w-100">
              <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>

<!-- ══ Main Content ═══════════════════════════════════════════ -->
<main class="main-content">
  <div class="content-area">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert-success-custom d-flex align-items-center gap-2 mb-3">
      <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert-error-custom d-flex align-items-center gap-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
    </div>

    <!-- Page content injected here -->
    <th:block th:replace="${content}"/>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
</div>
</html>
