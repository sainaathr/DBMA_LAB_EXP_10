<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Bill Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <style>
    @media print {
      .sidebar, .topbar, .no-print { display: none !important; }
      .main-content { margin: 0 !important; padding: 0 !important; }
      .content-area { max-width: 100% !important; }
    }
  </style>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'billing',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex align-items-center gap-2 mb-3 no-print">
    <a th:href="@{/billing}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i>Bills List</a>
    <h2 class="h5 fw-700 mb-0" th:text="'Bill #' + ${bill.billId}"></h2>
    <span th:class="'badge-pill badge-' + ${bill.paymentStatus.toLowerCase()} + ' ms-2'" th:text="${bill.paymentStatus}"></span>
    <button onclick="window.print()" class="btn btn-ghost btn-sm ms-auto">
      <i class="bi bi-printer me-1"></i>Print
    </button>
  </div>

  <div class="row g-3">
    <!-- Receipt Card -->
    <div class="col-lg-7">
      <div class="card" id="receiptArea">
        <div class="card-header">
          <i class="bi bi-receipt text-teal"></i>
          <span class="card-title">Receipt / Invoice</span>
        </div>
        <div class="card-body">
          <div class="d-flex justify-content-between mb-3">
            <div>
              <div class="fw-700" style="font-size:1.1rem; color:var(--teal);">MedScan DCMS</div>
              <div class="text-muted-sm">Diagnostic Center Management System</div>
            </div>
            <div class="text-end">
              <div class="fw-700">Bill #<span th:text="${bill.billId}"></span></div>
              <div class="text-muted-sm" th:text="${bill.billedAt}"></div>
            </div>
          </div>

          <div class="border rounded p-3 mb-3" style="font-size:.875rem;">
            <div class="row">
              <div class="col-6">
                <div class="text-muted mb-1" style="font-size:.75rem; font-weight:600; text-transform:uppercase;">Patient</div>
                <div class="fw-600" th:text="${bill.patientName}"></div>
              </div>
              <div class="col-6">
                <div class="text-muted mb-1" style="font-size:.75rem; font-weight:600; text-transform:uppercase;">Center</div>
                <div class="fw-600" th:text="${bill.centerName}"></div>
              </div>
            </div>
          </div>

          <!-- Tests list -->
          <div th:if="${booking != null}">
            <table class="data-table mb-3">
              <thead><tr><th>Test</th><th class="text-end">Price (₹)</th></tr></thead>
              <tbody>
                <tr th:each="bt : ${booking.tests}">
                  <td th:text="${bt.testName}"></td>
                  <td class="text-end" th:text="${bt.agreedPrice}"></td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Totals -->
          <div class="border-top pt-3" style="font-size:.9rem;">
            <div class="d-flex justify-content-between mb-1">
              <span>Subtotal</span>
              <span th:text="'₹' + ${#numbers.formatDecimal(bill.totalAmount,1,'COMMA',2,'POINT')}"></span>
            </div>
            <div class="d-flex justify-content-between mb-1 text-success">
              <span>Discount</span>
              <span th:text="'- ₹' + ${#numbers.formatDecimal(bill.discountAmount,1,'COMMA',2,'POINT')}"></span>
            </div>
            <div class="d-flex justify-content-between mb-1">
              <span>Amount Paid</span>
              <span class="text-success" th:text="'- ₹' + ${#numbers.formatDecimal(bill.amountPaid,1,'COMMA',2,'POINT')}"></span>
            </div>
            <div class="d-flex justify-content-between fw-700 border-top pt-2" style="font-size:1rem;">
              <span>Outstanding</span>
              <span th:class="${bill.outstandingAmount.compareTo(T(java.math.BigDecimal).ZERO) > 0} ? 'text-danger' : 'text-success'"
                    th:text="'₹' + ${#numbers.formatDecimal(bill.outstandingAmount,1,'COMMA',2,'POINT')}"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Payment Panel -->
    <div class="col-lg-5 no-print">
      <div class="card" th:if="${bill.paymentStatus != 'Paid'}">
        <div class="card-header"><i class="bi bi-cash-coin text-teal"></i><span class="card-title">Record Payment</span></div>
        <div class="card-body">
          <form th:action="@{/billing/{id}/pay(id=${bill.billId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
              <label class="form-label">Payment Amount (₹) *</label>
              <input type="number" name="paymentAmount" class="form-control"
                     th:value="${bill.outstandingAmount}" min="0.01" step="0.01" required/>
              <div class="text-muted-sm mt-1">Max: ₹<span th:text="${bill.outstandingAmount}"></span></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Payment Method *</label>
              <select name="paymentMethod" class="form-select" required>
                <option value="">— Select —</option>
                <option>Cash</option><option>Card</option>
                <option>UPI</option><option>Insurance</option><option>Other</option>
              </select>
            </div>
            <button type="submit" class="btn btn-teal w-100">
              <i class="bi bi-check-circle me-1"></i>Record Payment
            </button>
          </form>
        </div>
      </div>
      <div class="card" th:if="${bill.paymentStatus == 'Paid'}">
        <div class="card-body text-center py-4">
          <i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem;"></i>
          <div class="fw-700 mt-2" style="color:var(--success);">Fully Paid</div>
          <div class="text-muted-sm">via <span th:text="${bill.paymentMethod}"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
