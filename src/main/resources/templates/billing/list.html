<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Billing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'billing',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h5 fw-700 mb-0">Bills &amp; Payments
      <span class="badge bg-light text-muted ms-2" style="font-size:.78rem;" th:text="${total}">0</span>
    </h2>
    <a th:href="@{/bookings}" class="btn btn-ghost btn-sm"><i class="bi bi-calendar-plus me-1"></i>New Booking</a>
  </div>
  <!-- Filter -->
  <div class="card mb-3">
    <div class="card-body py-2">
      <form method="get" class="d-flex gap-2">
        <select name="status" class="form-select" style="max-width:180px;">
          <option value="">All Statuses</option>
          <option th:each="s : ${ {'Unpaid','Partial','Paid'} }"
                  th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option>
        </select>
        <button class="btn btn-teal btn-sm px-3" type="submit">Filter</button>
        <a th:href="@{/billing}" class="btn btn-ghost btn-sm">Clear</a>
      </form>
    </div>
  </div>
  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead><tr><th>Bill #</th><th>Booking #</th><th>Patient</th><th>Total (₹)</th><th>Discount</th><th>Paid</th><th>Outstanding</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          <tr th:each="b : ${bills}">
            <td class="fw-600" th:text="'#' + ${b.billId}"></td>
            <td>
              <a th:href="@{/bookings/{id}(id=${b.bookingId})}" class="text-teal fw-600"
                 th:text="'#' + ${b.bookingId}"></a>
            </td>
            <td th:text="${b.patientName}"></td>
            <td class="fw-600" th:text="'₹' + ${#numbers.formatDecimal(b.totalAmount,1,'COMMA',2,'POINT')}"></td>
            <td class="text-muted-sm" th:text="${b.discountAmount != null and b.discountAmount.compareTo(java.math.BigDecimal.ZERO) > 0} ? '₹' + ${b.discountAmount} : '—'"></td>
            <td class="text-success fw-600" th:text="'₹' + ${#numbers.formatDecimal(b.amountPaid,1,'COMMA',2,'POINT')}"></td>
            <td class="fw-600"
                th:class="${b.outstandingAmount.compareTo(java.math.BigDecimal.ZERO) > 0} ? 'fw-600 text-danger' : 'fw-600 text-success'"
                th:text="'₹' + ${#numbers.formatDecimal(b.outstandingAmount,1,'COMMA',2,'POINT')}"></td>
            <td><span th:class="'badge-pill badge-' + ${b.paymentStatus.toLowerCase()}" th:text="${b.paymentStatus}"></span></td>
            <td>
              <a th:href="@{/billing/{id}(id=${b.billId})}" class="btn-icon" title="View"><i class="bi bi-eye-fill"></i></a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(bills)}">
            <td colspan="9"><div class="empty-state"><i class="bi bi-receipt"></i><p>No bills found.</p></div></td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Pagination -->
    <div class="px-4 py-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span class="text-muted-sm">Page <strong th:text="${currentPage}"></strong> of <strong th:text="${totalPages}"></strong></span>
      <div class="pagination-wrap">
        <a th:href="@{/billing(page=${currentPage-1},status=${selectedStatus})}"
           class="page-btn" th:classappend="${currentPage==1} ? 'disabled'"><i class="bi bi-chevron-left"></i></a>
        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
          <a th:href="@{/billing(page=${i},status=${selectedStatus})}"
             class="page-btn" th:classappend="${i==currentPage} ? 'active'" th:text="${i}">1</a>
        </th:block>
        <a th:href="@{/billing(page=${currentPage+1},status=${selectedStatus})}"
           class="page-btn" th:classappend="${currentPage==totalPages} ? 'disabled'"><i class="bi bi-chevron-right"></i></a>
      </div>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
