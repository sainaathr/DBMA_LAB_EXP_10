<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title th:text="${pageTitle} + ' — MedScan'">Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'reports',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h5 fw-700 mb-0">Reports &amp; Analytics</h2>
  </div>

  <!-- Date Filter -->
  <div class="card mb-3">
    <div class="card-body py-2">
      <form method="get" class="d-flex flex-wrap gap-2 align-items-center">
        <label class="form-label mb-0" style="font-size:.85rem; white-space:nowrap;">From</label>
        <input type="date" name="from" class="form-control" style="max-width:160px;" th:value="${from}"/>
        <label class="form-label mb-0" style="font-size:.85rem; white-space:nowrap;">To</label>
        <input type="date" name="to"   class="form-control" style="max-width:160px;" th:value="${to}"/>
        <button class="btn btn-teal btn-sm px-3" type="submit">Apply</button>
      </form>
    </div>
  </div>

  <!-- Summary cards -->
  <div class="row g-3 mb-4" th:if="${summary != null}">
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-icon stat-icon-teal"><i class="bi bi-calendar-check-fill"></i></div>
        <div class="stat-value" th:text="${summary.total_bookings ?: 0}">0</div>
        <div class="stat-label">Total Bookings in Period</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-icon stat-icon-green"><i class="bi bi-check-circle-fill"></i></div>
        <div class="stat-value" th:text="${summary.completed ?: 0}">0</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-icon stat-icon-amber"><i class="bi bi-clock-fill"></i></div>
        <div class="stat-value" th:text="${summary.pending ?: 0}">0</div>
        <div class="stat-label">Pending</div>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="row g-3 mb-4">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header"><i class="bi bi-bar-chart-fill text-teal"></i><span class="card-title">Bookings per Day</span></div>
        <div class="card-body"><div class="chart-container"><canvas id="bookChart"></canvas></div></div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header"><i class="bi bi-cash-coin text-teal"></i><span class="card-title">Revenue per Day (₹)</span></div>
        <div class="card-body"><div class="chart-container"><canvas id="revChart"></canvas></div></div>
      </div>
    </div>
  </div>

  <!-- Revenue Table -->
  <div class="card" th:if="${not #lists.isEmpty(revenueRows)}">
    <div class="card-header"><i class="bi bi-table text-teal"></i><span class="card-title">Revenue Breakdown</span></div>
    <div class="table-wrapper">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Revenue Collected (₹)</th><th>Outstanding (₹)</th></tr></thead>
        <tbody>
          <tr th:each="r : ${revenueRows}">
            <td th:text="${r.day}"></td>
            <td class="text-success fw-600" th:text="'₹' + ${r.revenue != null ? #numbers.formatDecimal(r.revenue,1,'COMMA',2,'POINT') : '0.00'}"></td>
            <td class="fw-600"
                th:class="${r.outstanding != null and r.outstanding > 0} ? 'fw-600 text-danger' : 'fw-600 text-muted'"
                th:text="'₹' + ${r.outstanding != null ? #numbers.formatDecimal(r.outstanding,1,'COMMA',2,'POINT') : '0.00'}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
const bookLabels = JSON.parse(/*[[${bookLabels}]]*/ '[]');
const bookData   = JSON.parse(/*[[${bookData}]]*/ '[]');
const revLabels  = JSON.parse(/*[[${revLabels}]]*/ '[]');
const revData    = JSON.parse(/*[[${revData}]]*/ '[]');

new Chart(document.getElementById('bookChart'), {
  type: 'bar',
  data: { labels: bookLabels, datasets: [{ label: 'Bookings', data: bookData,
    backgroundColor: 'rgba(13,148,136,.7)', borderRadius: 4 }] },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
});

new Chart(document.getElementById('revChart'), {
  type: 'line',
  data: { labels: revLabels, datasets: [{ label: 'Revenue ₹', data: revData,
    borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.1)', fill: true, tension: .4, pointRadius: 3 }] },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
});
/*]]>*/
</script>
</body></html>
