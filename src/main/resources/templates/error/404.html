<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>404 — Page Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout('Not Found','',~{::pg})}">
<div th:fragment="pg">
  <div class="empty-state" style="padding: 80px 20px;">
    <i class="bi bi-question-circle" style="font-size:4rem; color:var(--teal); opacity:1;"></i>
    <h1 class="h3 mt-3 fw-700" style="color:var(--navy);">404 — Page Not Found</h1>
    <p class="text-muted mb-4" th:text="${errorMessage ?: 'The page you requested does not exist.'}"></p>
    <a href="/dashboard" class="btn btn-teal"><i class="bi bi-house-fill me-2"></i>Go to Dashboard</a>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
