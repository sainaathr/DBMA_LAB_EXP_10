<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Error — MedScan DCMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout('Error','',~{::pg})}">
<div th:fragment="pg">
  <div class="empty-state" style="padding: 80px 20px;">
    <i class="bi bi-exclamation-triangle" style="font-size:4rem; color:var(--warning); opacity:1;"></i>
    <h1 class="h3 mt-3 fw-700" style="color:var(--navy);">Something went wrong</h1>
    <p class="text-muted mb-4" th:text="${errorMessage ?: 'An unexpected error occurred. Please try again.'}"></p>
    <div class="d-flex gap-2 justify-content-center">
      <button onclick="history.back()" class="btn btn-ghost"><i class="bi bi-arrow-left me-2"></i>Go Back</button>
      <a href="/dashboard" class="btn btn-teal"><i class="bi bi-house-fill me-2"></i>Dashboard</a>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
