<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Test Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'tests',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a th:href="@{/tests}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
    <h2 class="h5 fw-700 mb-0" th:text="${pageTitle}">Test Form</h2>
  </div>
  <div class="card" style="max-width:600px;">
    <div class="card-header"><i class="bi bi-clipboard2-pulse-fill text-teal"></i><span class="card-title" th:text="${pageTitle}"></span></div>
    <div class="card-body">
      <form th:action="${test.testId != null} ? @{/tests/{id}/edit(id=${test.testId})} : @{/tests/new}"
            th:object="${test}" method="post" novalidate>
        <div class="mb-3">
          <label class="form-label">Test Name *</label>
          <input type="text" th:field="*{testName}" class="form-control"
                 th:classappend="${#fields.hasErrors('testName')} ? 'is-invalid'"
                 placeholder="E.g. Complete Blood Count"/>
          <div class="invalid-feedback" th:errors="*{testName}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea th:field="*{description}" class="form-control" rows="3"
                    placeholder="Brief description of the test…"></textarea>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Price (₹) *</label>
            <input type="number" th:field="*{price}" class="form-control" min="0" step="0.01"
                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{price}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Duration (minutes) *</label>
            <input type="number" th:field="*{durationMinutes}" class="form-control" min="1"
                   th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{durationMinutes}"></div>
          </div>
        </div>
        <div class="d-flex gap-2 pt-2">
          <button type="submit" class="btn btn-teal"><i class="bi bi-check-lg me-1"></i>Save Test</button>
          <a th:href="@{/tests}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
