<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Tests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'tests',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h5 fw-700 mb-0">Medical Tests</h2>
    <a th:href="@{/tests/new}" class="btn btn-teal btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Test</a>
  </div>
  <div class="card mb-3">
    <div class="card-body py-2">
      <form method="get" class="d-flex gap-2">
        <div class="search-box flex-grow-1">
          <i class="bi bi-search search-icon"></i>
          <input type="text" name="search" class="form-control" placeholder="Search tests…" th:value="${search}"/>
        </div>
        <button class="btn btn-teal btn-sm" type="submit">Search</button>
        <a th:href="@{/tests}" class="btn btn-ghost btn-sm">Clear</a>
      </form>
    </div>
  </div>
  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead><tr><th>ID</th><th>Test Name</th><th>Price (₹)</th><th>Duration</th><th>Description</th><th>Actions</th></tr></thead>
        <tbody>
          <tr th:each="t : ${tests}">
            <td class="fw-600 text-muted" th:text="${t.testId}"></td>
            <td class="fw-600" th:text="${t.testName}"></td>
            <td class="fw-600 text-teal" th:text="'₹' + ${#numbers.formatDecimal(t.price,1,'COMMA',2,'POINT')}"></td>
            <td th:text="${t.durationMinutes} + ' min'"></td>
            <td>
              <span th:text="${#strings.abbreviate(t.description,60)}" class="text-muted-sm"></span>
            </td>
            <td>
              <div class="d-flex gap-1">
                <a th:href="@{/tests/{id}/edit(id=${t.testId})}" class="btn-icon" title="Edit"><i class="bi bi-pencil-fill"></i></a>
                <button class="btn-icon danger" onclick="confirmDelete(this)"
                  th:data-action="@{/tests/{id}/delete(id=${t.testId})}" th:data-name="${t.testName}">
                  <i class="bi bi-trash3-fill"></i>
                </button>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(tests)}">
            <td colspan="6"><div class="empty-state"><i class="bi bi-clipboard2-pulse"></i><p>No tests found.</p></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <form id="deleteForm" method="post" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  </form>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>function confirmDelete(btn){if(confirm('Delete test "'+btn.dataset.name+'"?')){const f=document.getElementById('deleteForm');f.action=btn.dataset.action;f.submit();}}</script>
</body></html>
