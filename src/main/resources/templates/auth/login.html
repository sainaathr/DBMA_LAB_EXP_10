<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — MedScan DCMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <i class="bi bi-heart-pulse-fill"></i>
    </div>
    <h1 class="login-title mb-1">MedScan DCMS</h1>
    <p class="login-sub mb-4">Diagnostic Center Management System</p>

    <!-- Error / success messages -->
    <div th:if="${errorMsg}" class="alert-error-custom mb-3 d-flex align-items-center gap-2">
      <i class="bi bi-x-circle-fill"></i> <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${logoutMsg}" class="alert-success-custom mb-3 d-flex align-items-center gap-2">
      <i class="bi bi-check-circle-fill"></i> <span th:text="${logoutMsg}"></span>
    </div>

    <form th:action="@{/login}" method="post" novalidate>
      <!-- CSRF token is automatically added by Thymeleaf + Spring Security -->
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" id="username" name="username" class="form-control border-start-0"
                 placeholder="Enter username" required autocomplete="username"/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" id="password" name="password"
                 class="form-control border-start-0 border-end-0"
                 placeholder="Enter password" required autocomplete="current-password"/>
          <button type="button" class="input-group-text bg-white" id="togglePwd"
                  style="border-left:0; cursor:pointer;">
            <i class="bi bi-eye-slash text-muted" id="togglePwdIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-teal w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="mt-4 p-3 rounded" style="background:#f8fafc; border:1px solid #e2e8f0;">
      <p class="mb-1" style="font-size:.78rem; font-weight:600; color:#475569;">Demo Credentials</p>
      <p class="mb-0 text-muted" style="font-size:.78rem;">
        Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>Admin@1234</code>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Toggle password visibility
  document.getElementById('togglePwd').addEventListener('click', function () {
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('togglePwdIcon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.classList.replace('bi-eye-slash', 'bi-eye');
    } else {
      pwdInput.type = 'password';
      icon.classList.replace('bi-eye', 'bi-eye-slash');
    }
  });
</script>
</body>
</html>
