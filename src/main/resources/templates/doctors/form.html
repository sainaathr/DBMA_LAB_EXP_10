<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/><meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Doctor Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'doctors',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a th:href="@{/doctors}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
    <h2 class="h5 fw-700 mb-0" th:text="${pageTitle}">Doctor Form</h2>
  </div>
  <div class="card" style="max-width:600px;">
    <div class="card-header"><i class="bi bi-person-badge-fill text-teal"></i><span class="card-title" th:text="${pageTitle}"></span></div>
    <div class="card-body">
      <form th:action="${doctor.doctorId != null} ? @{/doctors/{id}/edit(id=${doctor.doctorId})} : @{/doctors/new}"
            th:object="${doctor}" method="post" novalidate>
        <div class="row g-3 mb-3">
          <div class="col-md-8">
            <label class="form-label" for="doctorName">Full Name *</label>
            <input type="text" id="doctorName" th:field="*{doctorName}" class="form-control"
                   th:classappend="${#fields.hasErrors('doctorName')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{doctorName}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="phone">Phone *</label>
            <input type="text" id="phone" th:field="*{phone}" class="form-control"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{phone}"></div>
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label" for="specialization">Specialization *</label>
            <input type="text" id="specialization" th:field="*{specialization}" class="form-control"
                   th:classappend="${#fields.hasErrors('specialization')} ? 'is-invalid'"
                   list="specList" placeholder="E.g. Radiology"/>
            <datalist id="specList">
              <option th:each="s : ${specializations}" th:value="${s}"></option>
            </datalist>
            <div class="invalid-feedback" th:errors="*{specialization}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="centerId">Assigned Center</label>
          <select id="centerId" th:field="*{centerId}" class="form-select">
            <option value="">— None —</option>
            <option th:each="c : ${centers}" th:value="${c.centerId}" th:text="${c.centerName}"></option>
          </select>
        </div>
        <div class="d-flex gap-2 pt-2">
          <button type="submit" class="btn btn-teal"><i class="bi bi-check-lg me-1"></i>Save Doctor</button>
          <a th:href="@{/doctors}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
