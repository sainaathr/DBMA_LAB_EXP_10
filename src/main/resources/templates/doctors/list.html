<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/><meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Doctors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'doctors',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="h5 fw-700 mb-0">Doctors</h2>
    <a th:href="@{/doctors/new}" class="btn btn-teal btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Doctor</a>
  </div>
  <!-- Filters -->
  <div class="card mb-3">
    <div class="card-body py-2">
      <form method="get" class="d-flex flex-wrap gap-2 align-items-center">
        <div class="search-box">
          <i class="bi bi-search search-icon"></i>
          <input type="text" name="search" class="form-control" style="min-width:200px;"
                 placeholder="Search doctors…" th:value="${search}"/>
        </div>
        <select name="specialization" class="form-select" style="max-width:200px;">
          <option value="">All Specializations</option>
          <option th:each="spec : ${specializations}" th:value="${spec}" th:text="${spec}"
                  th:selected="${spec == selectedSpec}"></option>
        </select>
        <button class="btn btn-teal btn-sm px-3" type="submit">Filter</button>
        <a th:href="@{/doctors}" class="btn btn-ghost btn-sm">Clear</a>
      </form>
    </div>
  </div>
  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Phone</th><th>Center</th><th>Actions</th></tr></thead>
        <tbody>
          <tr th:each="d : ${doctors}">
            <td class="fw-600 text-muted" th:text="${d.doctorId}"></td>
            <td class="fw-600" th:text="${d.doctorName}"></td>
            <td><span class="badge-pill badge-confirmed" th:text="${d.specialization}"></span></td>
            <td th:text="${d.phone}"></td>
            <td th:text="${d.centerName ?: '—'}"></td>
            <td>
              <div class="d-flex gap-1">
                <a th:href="@{/doctors/{id}/edit(id=${d.doctorId})}" class="btn-icon" title="Edit"><i class="bi bi-pencil-fill"></i></a>
                <button class="btn-icon danger" title="Delete"
                  onclick="confirmDelete(this)"
                  th:data-action="@{/doctors/{id}/delete(id=${d.doctorId})}"
                  th:data-name="${d.doctorName}"><i class="bi bi-trash3-fill"></i></button>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(doctors)}">
            <td colspan="6"><div class="empty-state"><i class="bi bi-person-badge"></i><p>No doctors found.</p></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <form id="deleteForm" method="post" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  </form>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>function confirmDelete(btn){if(confirm('Delete "'+btn.dataset.name+'"?')){const f=document.getElementById('deleteForm');f.action=btn.dataset.action;f.submit();}}</script>
</body></html>
