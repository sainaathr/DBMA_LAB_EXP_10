<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Centers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'centers',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h5 fw-700 mb-0">Diagnostic Centers</h2>
    <a th:href="@{/centers/new}" class="btn btn-teal btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Center</a>
  </div>
  <div class="card mb-3">
    <div class="card-body py-2">
      <form method="get" class="d-flex gap-2">
        <div class="search-box flex-grow-1">
          <i class="bi bi-search search-icon"></i>
          <input type="text" name="search" class="form-control" placeholder="Search by name or location…" th:value="${search}"/>
        </div>
        <button class="btn btn-teal btn-sm" type="submit">Search</button>
        <a th:href="@{/centers}" class="btn btn-ghost btn-sm">Clear</a>
      </form>
    </div>
  </div>
  <div class="row g-3">
    <div class="col-md-6 col-lg-4" th:each="c : ${centers}">
      <div class="card h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <div class="fw-700" th:text="${c.centerName}"></div>
              <div class="text-muted-sm"><i class="bi bi-geo-alt me-1"></i><span th:text="${c.location}"></span></div>
            </div>
            <div class="d-flex gap-1">
              <a th:href="@{/centers/{id}/edit(id=${c.centerId})}" class="btn-icon" title="Edit"><i class="bi bi-pencil-fill"></i></a>
              <button class="btn-icon danger" onclick="confirmDelete(this)"
                th:data-action="@{/centers/{id}/delete(id=${c.centerId})}" th:data-name="${c.centerName}">
                <i class="bi bi-trash3-fill"></i>
              </button>
            </div>
          </div>
          <div class="d-flex gap-3 my-2" style="font-size:.8rem; color:var(--muted);">
            <span><i class="bi bi-person-badge me-1"></i><span th:text="${c.doctorCount ?: 0}"></span> doctors</span>
            <span><i class="bi bi-calendar-check me-1"></i><span th:text="${c.bookingCount ?: 0}"></span> bookings</span>
          </div>
          <div class="text-muted-sm"><i class="bi bi-telephone me-1"></i><span th:text="${c.phone}"></span></div>
          <div class="text-muted-sm" th:if="${c.managerName}"><i class="bi bi-person me-1"></i><span th:text="${c.managerName}"></span></div>
        </div>
      </div>
    </div>
    <div class="col-12" th:if="${#lists.isEmpty(centers)}">
      <div class="empty-state"><i class="bi bi-building"></i><p>No centers found.</p></div>
    </div>
  </div>
  <form id="deleteForm" method="post" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  </form>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>function confirmDelete(btn){if(confirm('Delete center "'+btn.dataset.name+'"? All associated doctors must be reassigned first.')){const f=document.getElementById('deleteForm');f.action=btn.dataset.action;f.submit();}}</script>
</body></html>
