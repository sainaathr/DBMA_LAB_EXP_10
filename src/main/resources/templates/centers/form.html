<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <title th:text="${pageTitle} + ' — MedScan'">Center Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'centers',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a th:href="@{/centers}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
    <h2 class="h5 fw-700 mb-0" th:text="${pageTitle}">Center Form</h2>
  </div>
  <div class="card" style="max-width:650px;">
    <div class="card-header"><i class="bi bi-building-fill-cross text-teal"></i><span class="card-title" th:text="${pageTitle}"></span></div>
    <div class="card-body">
      <form th:action="${center.centerId != null} ? @{/centers/{id}/edit(id=${center.centerId})} : @{/centers/new}"
            th:object="${center}" method="post" novalidate>
        <div class="row g-3 mb-3">
          <div class="col-md-8">
            <label class="form-label">Center Name *</label>
            <input type="text" th:field="*{centerName}" class="form-control"
                   th:classappend="${#fields.hasErrors('centerName')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{centerName}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Capacity *</label>
            <input type="number" th:field="*{capacity}" class="form-control" min="1"
                   th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{capacity}"></div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Location / Address *</label>
          <input type="text" th:field="*{location}" class="form-control"
                 th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"/>
          <div class="invalid-feedback" th:errors="*{location}"></div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Phone *</label>
            <input type="text" th:field="*{phone}" class="form-control"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{phone}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Manager Name</label>
          <input type="text" th:field="*{managerName}" class="form-control"/>
        </div>
        <div class="d-flex gap-2 pt-2">
          <button type="submit" class="btn btn-teal"><i class="bi bi-check-lg me-1"></i>Save Center</button>
          <a th:href="@{/centers}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
