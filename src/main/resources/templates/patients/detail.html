<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/><meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} + ' — MedScan DCMS'">Patient Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'patients',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a th:href="@{/patients}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
    <h2 class="h5 fw-700 mb-0">Patient Details</h2>
    <a th:href="@{/patients/{id}/edit(id=${patient.patientId})}" class="btn btn-teal btn-sm ms-auto">
      <i class="bi bi-pencil-fill me-1"></i>Edit
    </a>
  </div>

  <div class="card" style="max-width:600px;">
    <div class="card-header"><i class="bi bi-person-circle text-teal"></i>
      <span class="card-title" th:text="${patient.patientName}"></span>
    </div>
    <div class="card-body">
      <dl class="row mb-0" style="font-size:.875rem;">
        <dt class="col-sm-4 text-muted">Patient ID</dt>
        <dd class="col-sm-8 fw-600" th:text="${patient.patientId}"></dd>
        <dt class="col-sm-4 text-muted">Date of Birth</dt>
        <dd class="col-sm-8" th:text="${patient.dateOfBirth ?: '—'}"></dd>
        <dt class="col-sm-4 text-muted">Age</dt>
        <dd class="col-sm-8" th:text="${patient.age != null ? patient.age + ' years' : '—'}"></dd>
        <dt class="col-sm-4 text-muted">Gender</dt>
        <dd class="col-sm-8" th:text="${patient.gender}"></dd>
        <dt class="col-sm-4 text-muted">Phone</dt>
        <dd class="col-sm-8" th:text="${patient.phone}"></dd>
        <dt class="col-sm-4 text-muted">Email</dt>
        <dd class="col-sm-8" th:text="${patient.email ?: '—'}"></dd>
        <dt class="col-sm-4 text-muted">Address</dt>
        <dd class="col-sm-8" th:text="${patient.address ?: '—'}"></dd>
        <dt class="col-sm-4 text-muted">Registered On</dt>
        <dd class="col-sm-8" th:text="${patient.createdAt}"></dd>
      </dl>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
