<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/><meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} + ' — MedScan DCMS'">Patient Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'patients',~{::pg})}">
<div th:fragment="pg">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a th:href="@{/patients}" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
    <h2 class="h5 fw-700 mb-0" th:text="${pageTitle}">Patient Form</h2>
  </div>

  <div class="card" style="max-width:700px;">
    <div class="card-header"><i class="bi bi-person-fill text-teal"></i><span class="card-title" th:text="${pageTitle}"></span></div>
    <div class="card-body">
      <form th:action="${patient.patientId != null} ? @{/patients/{id}/edit(id=${patient.patientId})} : @{/patients/new}"
            th:object="${patient}" method="post" novalidate>

        <div class="form-section-title">Personal Information</div>
        <div class="row g-3 mb-3">
          <div class="col-md-8">
            <label class="form-label" for="patientName">Full Name *</label>
            <input type="text" id="patientName" th:field="*{patientName}" class="form-control"
                   th:classappend="${#fields.hasErrors('patientName')} ? 'is-invalid'"
                   placeholder="E.g. Rahul Verma"/>
            <div class="invalid-feedback" th:errors="*{patientName}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="gender">Gender *</label>
            <select id="gender" th:field="*{gender}"
                    class="form-select" th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'">
              <option value="">— Select —</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            <div class="invalid-feedback" th:errors="*{gender}"></div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label" for="dateOfBirth">Date of Birth</label>
            <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control"/>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="phone">Phone *</label>
            <input type="text" id="phone" th:field="*{phone}" class="form-control"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                   placeholder="+91-99001-00001"/>
            <div class="invalid-feedback" th:errors="*{phone}"></div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   placeholder="patient@email.com"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="address">Address</label>
            <input type="text" id="address" th:field="*{address}" class="form-control"
                   placeholder="Street, City"/>
          </div>
        </div>

        <div class="d-flex gap-2 pt-2">
          <button type="submit" class="btn btn-teal">
            <i class="bi bi-check-lg me-1"></i>Save Patient
          </button>
          <a th:href="@{/patients}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
