<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/><meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} + ' — MedScan DCMS'">Patients</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout(${pageTitle},'patients',~{::pg})}">
<div th:fragment="pg">

  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="h5 fw-700 mb-0">Patients
      <span class="badge bg-light text-muted ms-2" style="font-size:.78rem;" th:text="${total}">0</span>
    </h2>
    <a th:href="@{/patients/new}" class="btn btn-teal btn-sm">
      <i class="bi bi-plus-lg me-1"></i>Add Patient
    </a>
  </div>

  <!-- Search -->
  <div class="card mb-3">
    <div class="card-body py-2">
      <form method="get" class="d-flex gap-2">
        <div class="search-box flex-grow-1">
          <i class="bi bi-search search-icon"></i>
          <input type="text" name="search" class="form-control"
                 placeholder="Search by name, phone or ID…" th:value="${search}"/>
        </div>
        <button class="btn btn-teal btn-sm px-3" type="submit">Search</button>
        <a th:href="@{/patients}" class="btn btn-ghost btn-sm">Clear</a>
      </form>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Gender</th><th>Phone</th><th>Email</th><th>DOB</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr th:each="p : ${patients}">
            <td class="fw-600 text-muted" th:text="${p.patientId}"></td>
            <td>
              <div class="fw-600" th:text="${p.patientName}"></div>
            </td>
            <td>
              <span th:class="'badge-pill ' + (${p.gender == 'Male'} ? 'badge-confirmed' : (${p.gender == 'Female'} ? 'badge-completed' : 'badge-pending'))"
                    th:text="${p.gender}"></span>
            </td>
            <td th:text="${p.phone}"></td>
            <td class="text-muted-sm" th:text="${p.email}"></td>
            <td th:text="${p.dateOfBirth}"></td>
            <td>
              <div class="d-flex gap-1">
                <a th:href="@{/patients/{id}(id=${p.patientId})}" class="btn-icon" title="View">
                  <i class="bi bi-eye-fill"></i></a>
                <a th:href="@{/patients/{id}/edit(id=${p.patientId})}" class="btn-icon" title="Edit">
                  <i class="bi bi-pencil-fill"></i></a>
                <button class="btn-icon danger" title="Delete"
                  onclick="confirmDelete(this)"
                  th:data-action="@{/patients/{id}/delete(id=${p.patientId})}"
                  th:data-name="${p.patientName}">
                  <i class="bi bi-trash3-fill"></i>
                </button>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(patients)}">
            <td colspan="7"><div class="empty-state"><i class="bi bi-people"></i><p>No patients found.</p></div></td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Pagination -->
    <div class="px-4 py-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span class="text-muted-sm">Page <strong th:text="${currentPage}">1</strong> of <strong th:text="${totalPages}">1</strong></span>
      <div class="pagination-wrap">
        <a th:href="@{/patients(page=${currentPage-1},search=${search})}"
           class="page-btn" th:classappend="${currentPage==1} ? 'disabled'">
          <i class="bi bi-chevron-left"></i></a>
        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
          <a th:href="@{/patients(page=${i},search=${search})}"
             class="page-btn" th:classappend="${i==currentPage} ? 'active'"
             th:text="${i}">1</a>
        </th:block>
        <a th:href="@{/patients(page=${currentPage+1},search=${search})}"
           class="page-btn" th:classappend="${currentPage==totalPages} ? 'disabled'">
          <i class="bi bi-chevron-right"></i></a>
      </div>
    </div>
  </div>

  <!-- Delete confirmation form (hidden) -->
  <form id="deleteForm" method="post" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  </form>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function confirmDelete(btn) {
  const name = btn.dataset.name;
  if (confirm('Delete patient "' + name + '"?\nThis cannot be undone.')) {
    const form = document.getElementById('deleteForm');
    form.action = btn.dataset.action;
    form.submit();
  }
}
</script>
</body></html>
