<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>Dashboard — MedScan DCMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: layout('Dashboard','dashboard',~{::main-content})}">
  <div th:fragment="main-content">

  <!-- ── Stat Cards ──────────────────────────────────────── -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-4 col-xl-2">
      <div class="stat-card">
        <div class="stat-icon stat-icon-teal"><i class="bi bi-people-fill"></i></div>
        <div class="stat-value" th:text="${stats.totalPatients}">0</div>
        <div class="stat-label">Total Patients</div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="stat-card">
        <div class="stat-icon stat-icon-blue"><i class="bi bi-person-badge-fill"></i></div>
        <div class="stat-value" th:text="${stats.totalDoctors}">0</div>
        <div class="stat-label">Doctors</div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="stat-card">
        <div class="stat-icon stat-icon-cyan"><i class="bi bi-building-fill-cross"></i></div>
        <div class="stat-value" th:text="${stats.totalCenters}">0</div>
        <div class="stat-label">Centers</div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="stat-card">
        <div class="stat-icon stat-icon-green"><i class="bi bi-clipboard2-pulse-fill"></i></div>
        <div class="stat-value" th:text="${stats.totalTests}">0</div>
        <div class="stat-label">Tests Available</div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="stat-card">
        <div class="stat-icon stat-icon-amber"><i class="bi bi-calendar-check-fill"></i></div>
        <div class="stat-value" th:text="${stats.totalBookings}">0</div>
        <div class="stat-label">Total Bookings</div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="stat-card">
        <div class="stat-icon stat-icon-red"><i class="bi bi-clock-fill"></i></div>
        <div class="stat-value" th:text="${stats.pendingBookings}">0</div>
        <div class="stat-label">Pending</div>
      </div>
    </div>
  </div>

  <!-- ── Revenue Cards ───────────────────────────────────── -->
  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <div class="stat-card d-flex align-items-center gap-3">
        <div class="stat-icon stat-icon-green mb-0"><i class="bi bi-currency-rupee"></i></div>
        <div>
          <div class="stat-value" th:text="'₹' + ${#numbers.formatDecimal(stats.totalRevenue,1,'COMMA',2,'POINT')}">₹0</div>
          <div class="stat-label">Revenue Collected</div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="stat-card d-flex align-items-center gap-3">
        <div class="stat-icon stat-icon-red mb-0"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <div>
          <div class="stat-value" th:text="'₹' + ${#numbers.formatDecimal(stats.outstandingAmount,1,'COMMA',2,'POINT')}">₹0</div>
          <div class="stat-label">Outstanding Bills</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Charts Row ──────────────────────────────────────── -->
  <div class="row g-3 mb-4">
    <div class="col-lg-8">
      <div class="card h-100">
        <div class="card-header">
          <i class="bi bi-graph-up text-teal"></i>
          <span class="card-title">Booking Trend (Last 30 Days)</span>
        </div>
        <div class="card-body">
          <div class="chart-container"><canvas id="bookingTrendChart"></canvas></div>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="card h-100">
        <div class="card-header">
          <i class="bi bi-pie-chart-fill text-teal"></i>
          <span class="card-title">Booking Status</span>
        </div>
        <div class="card-body">
          <div class="chart-container"><canvas id="statusChart"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Revenue Trend ────────────────────────────────────── -->
  <div class="row g-3 mb-4">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <i class="bi bi-cash-coin text-teal"></i>
          <span class="card-title">Revenue Trend (Last 30 Days)</span>
        </div>
        <div class="card-body">
          <div class="chart-container"><canvas id="revenueTrendChart"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Recent Bookings ─────────────────────────────────── -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-calendar-event-fill text-teal"></i>
        <span class="card-title">Recent Bookings</span>
      </div>
      <a th:href="@{/bookings}" class="btn btn-ghost btn-sm">View All</a>
    </div>
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>#ID</th><th>Patient</th><th>Center</th><th>Date</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="b : ${recentBookings}">
            <td class="fw-600" th:text="'#' + ${b.bookingId}"></td>
            <td th:text="${b.patientName}"></td>
            <td th:text="${b.centerName}"></td>
            <td th:text="${b.bookingDate}"></td>
            <td>
              <span th:class="'badge-pill badge-' + ${b.status.toLowerCase()}"
                    th:text="${b.status}"></span>
            </td>
            <td>
              <a th:href="@{/bookings/{id}(id=${b.bookingId})}" class="btn-icon" title="View">
                <i class="bi bi-eye-fill"></i>
              </a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(recentBookings)}">
            <td colspan="6" class="text-center py-4 text-muted">No bookings yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  </div><!-- /main-content fragment -->
</div><!-- /th:replace -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
const trendLabels = /*[[${trendLabels}]]*/ '[]';
const trendData   = /*[[${trendData}]]*/ '[]';
const revLabels   = /*[[${revLabels}]]*/ '[]';
const revData     = /*[[${revData}]]*/ '[]';
const statusDist  = /*[[${statusDist}]]*/ '{}';

const statusObj   = JSON.parse(statusDist);
const statusKeys  = Object.keys(statusObj);
const statusVals  = Object.values(statusObj);

const palette = { Pending:'#f59e0b', Confirmed:'#3b82f6', Completed:'#10b981', Cancelled:'#ef4444' };
const statusColors = statusKeys.map(k => palette[k] || '#94a3b8');

// Booking trend line chart
new Chart(document.getElementById('bookingTrendChart'), {
  type: 'line',
  data: {
    labels: JSON.parse(trendLabels),
    datasets: [{ label: 'Bookings', data: JSON.parse(trendData),
      borderColor: '#0d9488', backgroundColor: 'rgba(13,148,136,.1)',
      fill: true, tension: .4, pointRadius: 3 }]
  },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
});

// Status pie chart
new Chart(document.getElementById('statusChart'), {
  type: 'doughnut',
  data: { labels: statusKeys, datasets: [{ data: statusVals, backgroundColor: statusColors, borderWidth: 2 }] },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
});

// Revenue bar chart
new Chart(document.getElementById('revenueTrendChart'), {
  type: 'bar',
  data: {
    labels: JSON.parse(revLabels),
    datasets: [{ label: 'Revenue (₹)', data: JSON.parse(revData),
      backgroundColor: 'rgba(13,148,136,.7)', borderRadius: 4 }]
  },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
});
/*]]>*/
</script>
</body>
</html>
