# Application Configuration — Diagnostic Center Management System
# Uses environment variables for sensitive values (DB credentials).
# Never commit real credentials. See .env.example for variable names.

spring.application.name=Diagnostic Center Management System

# ─── SERVER ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── DATASOURCE (JDBC) ─────────────────────────────────────────────────────────
# Set DB_URL, DB_USERNAME, DB_PASSWORD env vars before running.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/diagnostic_center?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:dcadmin}
spring.datasource.password=${DB_PASSWORD:dcpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool — HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── THYMELEAF ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html

# ─── SESSION ───────────────────────────────────────────────────────────────────
server.servlet.session.timeout=30m

# ─── ACTUATOR (health endpoint for deployment) ─────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── LOGGING ───────────────────────────────────────────────────────────────────
logging.level.com.diagnosticcenter=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.jdbc=WARN
# NEVER log SQL parameters in production — may expose patient data
logging.level.org.springframework.jdbc.core.JdbcTemplate=WARN

# ─── ERROR HANDLING ────────────────────────────────────────────────────────────
# Do not expose stack traces to browser
server.error.include-stacktrace=never
server.error.include-message=always
server.error.whitelabel.enabled=false
